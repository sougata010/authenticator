name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install JavaScript dependencies
        run: |
          cd mobile
          npm install

      - name: Debug React Native CLI Config
        run: |
          cd mobile
          echo "=== CLI Config from mobile/ ==="
          npx @react-native-community/cli config || true
          cd android
          echo "=== CLI Config from mobile/android/ ==="
          npx @react-native-community/cli config || true

      - name: Build Android Debug APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info --stacktrace


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
